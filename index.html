<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grocy 扫码录入</title>
<style>
  /* ============================================================
     Grocy 扫码录入 - 样式
     版本: 2.1.0 (2026-07-28) - HTML/JS 分离版
     ============================================================ */
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1f2733; --sub:#6b7784;
    --line:#e4e8ec; --accent:#2e9e5b; --accent-d:#25834b;
    --in:#2e9e5b; --out:#e0603a; --warn:#c9891f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:12px 12px 90px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  header h1{font-size:19px;margin:0;font-weight:700;}
  .header-right{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#c0c7ce;display:inline-block;margin-right:6px;vertical-align:middle;}
  .dot.ok{background:var(--accent);} .dot.bad{background:var(--out);}
  .hint{font-size:12px;color:var(--sub);}
  .btn-settings{width:36px;height:36px;border:0;background:transparent;font-size:20px;cursor:pointer;
    border-radius:8px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  .btn-settings:active{background:rgba(0,0,0,.08);}

  .seg-row{display:flex;gap:10px;margin-bottom:12px;}
  .seg{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:4px;display:flex;position:relative;overflow:hidden;}
  .seg button{flex:1;border:0;background:transparent;color:var(--sub);
    font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;transition:.18s;cursor:pointer;}
  .seg .lbl{position:absolute;top:-8px;left:10px;font-size:10px;color:var(--sub);background:var(--bg);padding:0 4px;}
  .seg button.on{color:#fff;}
  #segMode button.on{background:var(--in);} #segMode.out button.on{background:var(--out);}
  #segQty  button.on{background:#3b6fb0;}
  #segEngine button.on{background:#3b6fb0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .scanwrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;height:42vh;max-height:340px;}
  #scanVideo{width:100%;height:100%;display:block;border-radius:12px;background:#000;object-fit:cover;}
  #reader{width:100%;height:100%;border-radius:12px;overflow:hidden;background:#000;}
  #reader video, #reader canvas{width:100%!important;height:100%!important;object-fit:cover!important;display:block;}
  .scanbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:80%;height:34%;border:2px solid rgba(255,255,255,.9);border-radius:12px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none;}
  .scanbox::before,.scanbox::after{content:"";position:absolute;width:24px;height:24px;border:3px solid #2e9e5b;}
  .scanbox::before{left:-4px;top:-4px;border-right:0;border-bottom:0;}
  .scanbox::after{right:-4px;bottom:-4px;border-left:0;border-top:0;}

  .cam-overlay{position:absolute;bottom:10px;right:10px;display:flex;gap:8px;z-index:5;align-items:center;}
  .cam-btn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:19px;
    background:rgba(0,0,0,.45);color:#fff;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:.18s;padding:0;}
  .cam-btn:active{transform:scale(.92);}
  .cam-btn.main{width:52px;height:52px;background:rgba(46,158,91,.92);font-size:22px;}
  .cam-btn.main.on{background:rgba(224,96,58,.92);font-size:20px;}
  .cam-btn[disabled]{opacity:.3;pointer-events:none;}
  .cam-btn.torch-on{background:rgba(249,180,0,.88);color:#333;}

  .engine-badge{position:absolute;top:8px;left:8px;
    background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:20px;z-index:5;pointer-events:none;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .manual{display:flex;gap:8px;margin-top:10px;}
  .manual input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;}
  .manual input:focus{border-color:var(--accent);}
  .manual button{border:0;background:#eef1f4;border-radius:10px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;}

  #preview{display:none;}
  .pv-top{display:flex;gap:12px;}
  .pv-img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#eef1f4;flex:none;}
  .pv-img.ph{display:flex;align-items:center;justify-content:center;color:#b7c0c9;font-size:12px;}
  .pv-name{font-size:16px;font-weight:700;line-height:1.35;margin:0 0 4px;}
  .pv-stock{font-size:12px;color:var(--sub);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
  .badge.new{background:#fff2df;color:var(--warn);}
  .pv-desc{margin-top:10px;font-size:13px;color:#39424d;white-space:pre-wrap;line-height:1.55;
    background:#f7f9fa;border-radius:10px;padding:10px 12px;max-height:150px;overflow:auto;}
  .qtybox{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .qtybox .stp{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;}
  .qtybox input{flex:1;text-align:center;font-size:20px;font-weight:800;border:1px solid var(--line);border-radius:11px;height:44px;outline:none;}
  .qtybox .qu{font-size:13px;color:var(--sub);min-width:34px;text-align:center;}
  .cfm-row{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;border:0;border-radius:11px;padding:12px 0;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-p{background:var(--accent);color:#fff;} .btn-p:active{background:var(--accent-d);}
  .btn-g{background:#eef1f4;color:var(--ink);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;
    opacity:0;pointer-events:none;transition:.25s;}
  .sheet-overlay.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;
    background:var(--card);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:.3s cubic-bezier(.32,.72,0,1);
    max-width:520px;margin:0 auto;max-height:70vh;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .sheet-head h2{font-size:17px;margin:0;font-weight:700;}
  .sheet-close{width:32px;height:32px;border:0;background:#eef1f4;border-radius:50%;
    font-size:16px;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;}
  .sheet-item{margin-bottom:18px;}
  .sheet-item:last-child{margin-bottom:0;}
  .sheet-item .item-lbl{font-size:12px;color:var(--sub);margin-bottom:8px;display:block;font-weight:600;}
  .chip{flex:1;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
  .chip.on{background:#e8f3ec;color:var(--accent);border-color:#bfe3cd;}
  .chip-row{display:flex;gap:8px;}

  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);
    background:#222d38;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;
    opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:88%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.ok{background:#25834b;} #toast.err{background:#c0392b;} #toast.info{background:#2b3b52;}

  .log h3{font-size:13px;color:var(--sub);margin:4px 0 8px;font-weight:600;}
  .log-item{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .log-item:last-child{border-bottom:0;}
  .log-item .t{color:var(--sub);font-size:12px;}
  .tag-in{color:var(--in);font-weight:700;} .tag-out{color:var(--out);font-weight:700;}

  .cam-off-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#1a1a2e;color:#9aa7b4;font-size:14px;text-align:center;z-index:2;gap:10px;}
  .cam-off-msg svg{width:48px;height:48px;opacity:.5;}
  .cam-off-msg span{opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 扫码录入</h1>
    <div class="header-right">
      <span class="hint"><span id="dot" class="dot"></span><span id="conn">连接中…</span></span>
      <button class="btn-settings" id="btnSettings">⚙️</button>
    </div>
  </header>

  <div class="seg-row">
    <div class="seg" id="segMode">
      <span class="lbl">操作</span>
      <button data-v="in" class="on">📥 入库</button>
      <button data-v="out">📤 出库</button>
    </div>
    <div class="seg" id="segQty">
      <span class="lbl">数量</span>
      <button data-v="each" class="on">逐件</button>
      <button data-v="manual">数量</button>
    </div>
  </div>

  <div class="card">
    <div class="scanwrap">
      <video id="scanVideo" playsinline muted></video>
      <div id="reader" style="display:none;"></div>
      <div class="scanbox"></div>
      <div class="engine-badge" id="camEngine">未开启</div>
      <div class="cam-off-msg" id="camOffMsg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 7a2 2 0 012-2h3l2-2h4l2 2h3a2 2 0 012 2v9a2 2 0 01-2 2h-3l-2 2h-4l-2-2H5a2 2 0 01-2-2V7z"/>
          <circle cx="12" cy="12" r="3.5"/>
        </svg>
        <span>点击下方 📷 开启摄像头</span>
      </div>
      <div class="cam-overlay">
        <button class="cam-btn" id="btnTorch" disabled>🔦</button>
        <button class="cam-btn main" id="btnCam">📷</button>
      </div>
    </div>
    <div class="manual">
      <input id="mInput" inputmode="numeric" placeholder="或手动输入/扫码枪录入条码" enterkeyhint="search">
      <button id="mGo">查询</button>
    </div>
  </div>

  <div class="card" id="preview">
    <div class="pv-top">
      <img class="pv-img" id="pvImg" alt="">
      <div style="min-width:0;flex:1;">
        <p class="pv-name" id="pvName">—<span id="pvNew" class="badge new" style="display:none;">新建</span></p>
        <div class="pv-stock" id="pvStock"></div>
      </div>
    </div>
    <div class="pv-desc" id="pvDesc" style="display:none;"></div>

    <div id="qtyArea" style="display:none;">
      <div class="item-lbl" style="margin:0 0 6px;">
        <span id="pvModeLabel" style="font-weight:700;color:var(--in);">← 入库</span>
        <span style="color:var(--sub);font-weight:400;"> &middot; </span>
        <span id="pvQtyLabel" style="color:var(--sub);">逐件</span>
      </div>
      <div class="qtybox">
        <button class="stp" id="qMinus">−</button>
        <input id="qInput" type="number" inputmode="decimal" value="1" min="0.001" step="1">
        <button class="stp" id="qPlus">+</button>
        <span class="qu" id="qUnit"></span>
      </div>
      <div style="margin-top:8px;">
        <select id="qloc" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;box-sizing:border-box;">
          <option value="">不指定位置</option>
        </select>
      </div>
      <div class="cfm-row">
        <button class="btn btn-g" id="pCancel">取消</button>
        <button class="btn btn-p" id="pConfirm">确认写入</button>
      </div>
    </div>

    <div id="createArea" style="display:none; border-top:1px dashed var(--line); margin-top:12px; padding-top:12px;">
      <div class="hint" style="margin-bottom:8px;">Grocy 中无此条码，新建产品并入库：</div>
      <img id="cImg" style="width:100%;height:140px;object-fit:cover;border-radius:10px;background:#eef1f4;margin-bottom:8px;display:none;">
      <input id="cName" placeholder="产品名称" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;outline:none;margin-bottom:8px;box-sizing:border-box;">
      <textarea id="cDesc" placeholder="描述/规格" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box;height:64px;resize:none;"></textarea>
      <select id="cLoc" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:8px;box-sizing:border-box;background:#fff;"></select>
      <select id="cQu" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:8px;box-sizing:border-box;background:#fff;"></select>
      <div class="qtybox">
        <button class="stp" id="cMinus">−</button>
        <input id="cQty" type="number" inputmode="decimal" value="1" min="0.001" step="1">
        <button class="stp" id="cPlus">+</button>
        <span class="qu">入库数量</span>
      </div>
      <div class="cfm-row">
        <button class="btn btn-g" id="btnCNCancel">取消</button>
        <button class="btn btn-p" id="btnCreate">创建并入库</button>
      </div>
    </div>
  </div>

  <div class="card log">
    <h3>最近记录</h3>
    <div id="logList"><div class="hint">还没有记录</div></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheetSettings">
  <div class="sheet-head">
    <h2>设置</h2>
    <button class="sheet-close" id="btnCloseSheet">✕</button>
  </div>
  <div class="sheet-item">
    <span class="item-lbl">识别引擎</span>
    <div class="chip-row" id="chipEngine" style="margin-bottom:12px;">
      <button class="chip on" data-v="auto">自动</button>
      <button class="chip" data-v="native">原生</button>
      <button class="chip" data-v="zxing">ZXing</button>
      <button class="chip" data-v="quagga">Quagga</button>
    </div>
    <span class="hint" style="font-size:11px;line-height:1.6;">
      自动=先试原生,失败回退ZXing。原生=硬件加速(最快)。ZXing=最稳。Quagga=画面较卡。
    </span>
  </div>
  <div class="sheet-item">
    <span class="item-lbl">扫码反馈</span>
    <div class="chip-row">
      <button class="chip on" id="btnSnd">🔊 音效</button>
      <button class="chip on" id="btnVib">📳 震动</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/html5-qrcode.min.js?v=2"></script>
<script src="/quagga.min.js?v=2"></script>
<script src="/app.js?v=2"></script>
</body>
</html>
